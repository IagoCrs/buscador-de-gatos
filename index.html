<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de gatos</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header> 
        <h1>Buscador de Gatos</h1>
    </header>

    <main>
        <div class="box-container">
            <div class="box" id="box">
                <a href="#" target="_blank" class="external-link">
                    <img src="images/gato-00.jpg" alt="Gatinho">
                </a>
                <div class="box-body">
                    <h1>Nome do gatinho</h1>
                    <p>
                        Nala, Hamilton e Chico.
                    </p>
                </div>
            </div>

            <div class="box-footer">
                <input type="text" id="myInput" name="myInput" placeholder="Insira o nome do Gatinho">
                <button class="btn" id="btn">Buscar</button>
            </div>
        </div>
    </main>
    <script src="js/script.js"></script>
</body>

</html>
